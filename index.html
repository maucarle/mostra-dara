<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Il Nodo di Dara - Soundscape</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent; /* Rimuove il lampo blu al tocco su mobile */
        }

        body {
            background-color: #080808; /* Nero profondo materico */
            color: #f5f5f0;
            font-family: 'Jost', sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
            overflow: hidden; /* Blocca lo scroll dello schermo */
        }

        .logo {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.8rem;
            letter-spacing: 0.1em;
            margin-bottom: 5px;
            color: #f5f5f0;
        }

        .subtitle {
            font-size: 1rem;
            font-weight: 300;
            opacity: 0.5;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: 60px;
        }

        .instructions {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 1.4rem;
            color: #8B2B2B; /* Rosso Nodo di Dara */
            margin-bottom: 50px;
            line-height: 1.4;
        }

        /* Tasto Play Personalizzato Elegante */
        .play-btn {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background-color: transparent;
            border: 1px solid rgba(139, 43, 43, 0.5);
            color: #8B2B2B;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.5s ease;
            outline: none;
        }

        /* Effetto quando è in riproduzione */
        .play-btn.playing {
            background-color: rgba(139, 43, 43, 0.1);
            border-color: #8B2B2B;
            box-shadow: 0 0 30px rgba(139, 43, 43, 0.2);
        }

        .play-btn svg {
            width: 35px;
            height: 35px;
            fill: currentColor;
            margin-left: 6px; /* Compensa l'ottica del triangolo Play */
            transition: all 0.3s;
        }

        .play-btn.playing svg {
            margin-left: 0; /* Centra le due barre della Pausa */
        }

        .status {
            margin-top: 30px;
            font-size: 0.8rem;
            opacity: 0.4;
            font-weight: 300;
            text-transform: uppercase;
            letter-spacing: 0.2em;
        }

        /* Nasconde il brutto player di sistema */
        audio {
            display: none;
        }
    </style>
</head>
<body>

    <div class="logo">Il Nodo di Dara</div>
    <div class="subtitle">La Foresta Sospesa</div>

    <div class="instructions">Indossa le cuffie, premi play.<br>Inizia l'immersione.</div>

    <button class="play-btn" id="playBtn" onclick="togglePlay()">
        <svg id="playIcon" viewBox="0 0 24 24">
            <path d="M8 5v14l11-7z"/>
        </svg>
        <svg id="pauseIcon" viewBox="0 0 24 24" style="display:none;">
            <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
        </svg>
    </button>

    <div class="status" id="statusText">In attesa</div>

    <audio id="soundscape" loop preload="auto">
        <source src="https://f002.backblazeb2.com/file/SoundScape/Soundscape.mp3" type="audio/mpeg">
    </audio>

    <script>
const audio = document.getElementById("soundscape");
const playBtn = document.getElementById("playBtn");
const playIcon = document.getElementById("playIcon");
const pauseIcon = document.getElementById("pauseIcon");
const statusText = document.getElementById("statusText");

// Rendi il tasto subito cliccabile (fondamentale per mobile)
playBtn.style.opacity = "1";
playBtn.style.cursor = "pointer";
statusText.innerText = "Tocca per iniziare";

function togglePlay() {
    // Forza il caricamento al primo click se non è ancora partito
    if (audio.readyState === 0) {
        statusText.innerText = "Connessione in corso...";
        audio.load();
    }

    if (audio.paused) {
        // La "Promise" di play() gestisce i blocchi dei browser mobile
        audio.play().then(() => {
            playBtn.classList.add("playing");
            playIcon.style.display = "none";
            pauseIcon.style.display = "block";
            statusText.innerText = "In riproduzione";
        }).catch(error => {
            console.error("Errore Play:", error);
            statusText.innerText = "Tocca di nuovo per riprodurre";
        });
    } else {
        audio.pause();
        playBtn.classList.remove("playing");
        playIcon.style.display = "block";
        pauseIcon.style.display = "none";
        statusText.innerText = "In pausa";
    }
}

// Opzionale: se l'audio si interrompe per buffering, avvisa l'utente
audio.addEventListener('waiting', () => {
    statusText.innerText = "Caricamento...";
});
    </script>
</body>
</html>
